name: Run local analyze and test

on:
  workflow_dispatch:

jobs:
  analyze-test:
    # This will not work on GitHub, but works with ACT.
    # This allows one to test the workflow prior to committing and creating a release
    # Even though this won't run on github, it still parses the uses statement
    uses: weewx-extensions/development-tools/.github/workflows/analyze-test.yml@master
    # uses: ./../../weewx-extensions/development-tools/.github/workflows/analyze-test.yml
    with:
      module-name: 'mqttloopdata'
      #pip-list: 'paho-mqtt'
      #package-list: 'mosquitto'
      weewx-extension: 'https://github.com/chaunceygardiner/weewx-loopdata/'
      # weewx-extension-ver: 'master'
      unit-test: false
      function-test: false
      integration-test: true
      e2e-test: false
      #flake-extra-parms: '--exclude tests'
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      CODACY_API_TOKEN: ${{ secrets.CODACY.API_TOKEN }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
