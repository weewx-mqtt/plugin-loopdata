lang = en

[CheetahGenerator]
    encoding = utf8
    [[html]]
        [[[index]]]
            generate_once = True
            template = index.html.tmpl
    [[javascript]]
        [[[init]]]
            generate_once = True
            template = javascript/init.js.tmpl
        [[[mqtt]]]
            generate_once = True
            template = javascript/mqtt.js.tmpl

[CopyGenerator]
    copy_once = javascript/*.js

[Generators]
        generator_list = weewx.cheetahgenerator.CheetahGenerator, weewx.reportengine.CopyGenerator
